name: Derleme testi (gecici)

on:
  push:
    branches: [ "derleme-testi" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: User ve Admin debug derle
        run: |
          chmod +x gradlew
          ./gradlew assembleUserDebug assembleAdminDebug --stacktrace
