name: Android Build

on:
  push:
    branches: [ "main", "publish-current-app" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (User APK)
      run: ./gradlew assembleUserRelease

    - name: Build with Gradle (Admin APK)
      run: ./gradlew assembleAdminRelease

    - name: Upload User APK
      uses: actions/upload-artifact@v3
      with:
        name: Repo-User-APK
        path: app/build/outputs/apk/user/release/app-user-release-unsigned.apk

    - name: Upload Admin APK
      uses: actions/upload-artifact@v3
      with:
        name: Repo-Admin-APK
        path: app/build/outputs/apk/admin/release/app-admin-release-unsigned.apk
